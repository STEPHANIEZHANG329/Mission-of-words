name: Preflight (no paid image calls)

on:
  push:
    branches: ['cursor/**', main]
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python3 -m pytest -q
      - name: Preflight (no network image calls)
        env:
          PYTHONPATH: src
        run: python3 -m llk.preflight
      - name: Confirm this job did not call the image API
        run: echo "PREFLIGHT_JOB_MAKES_NO_IMAGE_API_REQUESTS"
