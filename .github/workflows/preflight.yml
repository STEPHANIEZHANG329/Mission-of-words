name: Preflight (no paid image calls)

on:
  push:
    branches: ['cursor/**', main]
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python3 -m pytest -q
      - name: Preflight before paid generation
        env:
          PYTHONPATH: src
        run: python3 -m llk.preflight --before-paid
      - name: Confirm GPT2 was not used
        run: |
          if grep -q '"counted": true' ops/ledger.jsonl; then
            echo "LEDGER_MUST_STAY_EMPTY_ON_PREFLIGHT"
            exit 1
          fi
          echo "NO_PAID_IMAGE_CALLS"
