name: Phase C GPT2 production generation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GPT2: ${{ secrets.GPT2 }}
      ALLOW_PAID_IMAGE_CALLS: '1'
      BRIGHT_HEARTS_CONFIRM_PAID_GENERATION: OWNER_PHASE_C_GPT2_REBUILD
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce commercial layout approval before paid generation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          layout = json.loads(Path('ops/layout_gate.json').read_text())
          paid = json.loads(Path('ops/phase_c_paid_gate.json').read_text())

          if layout.get('status') != 'PASS' or layout.get('approved_for_paid_generation') is not True:
              raise SystemExit('COMMERCIAL_LAYOUT_GATE_BLOCKED')
          if paid.get('owner_stop') is True or paid.get('paid_calls_enabled') is not True or paid.get('allow_paid_image_calls') is not True:
              raise SystemExit('OWNER_PAID_GATE_BLOCKED')
          print('COMMERCIAL_LAYOUT_GATE_PASS')
          print('OWNER_PAID_GATE_PASS')
          PY

      - name: Confirm GPT2 secret exists without printing it
        run: |
          set -euo pipefail
          if [ -z "${GPT2:-}" ]; then
            echo "GPT2_SECRET_MISSING"
            exit 1
          fi
          echo "GPT2_SECRET_PRESENT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile and test before any paid image call
        run: |
          set -euo pipefail
          python -m py_compile src/mission_of_words/production_qa.py src/mission_of_words/build_production.py src/mission_of_words/generate_assets.py src/mission_of_words/paid_images.py src/mission_of_words/asset_ledger.py
          python -c "from mission_of_words.production_qa import evaluate_production"
          pytest -q tests/test_production_qa.py tests/test_generate_assets.py tests/test_paid_images.py tests/test_brand.py

      - name: Generate bounded GPT2 assets
        run: python -m mission_of_words.generate_assets --confirm OWNER_PHASE_C_GPT2_REBUILD

      - name: Upload generated assets immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-lampkeepers-phase-c-assets
          path: |
            assets/accepted/
            assets/raw/
            ops/asset_ledger.json
            ops/asset_ledger.jsonl
            output/asset_ledger.json
            output/generation_summary.json
          if-no-files-found: warn

      - name: Summarize ledger without secrets
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('ops/asset_ledger.json', 'output/asset_ledger.json', 'output/generation_summary.json'):
              path = Path(name)
              if not path.is_file():
                  print('MISSING', name)
                  continue
              data = json.loads(path.read_text())
              print(name, json.dumps({k: data[k] for k in data if k not in {'assets', 'packets'}}, indent=2))
          PY

  compose-production:
    needs: generate-assets
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download generated assets
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: little-lampkeepers-phase-c-assets
          path: .

      - name: Build production candidate
        run: python -m mission_of_words.build_production

      - name: Summarize QA without secrets
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('ops/asset_ledger.json', 'output/asset_ledger.json', 'output/generation_summary.json', 'output/qa_report.json'):
              path = Path(name)
              if not path.is_file():
                  print('MISSING', name)
                  continue
              data = json.loads(path.read_text())
              if name.endswith('qa_report.json'):
                  print(name, json.dumps({k: data[k] for k in data if k != 'pages'}, indent=2)[:4000])
              else:
                  print(name, json.dumps({k: data[k] for k in data if k not in {'assets', 'packets'}}, indent=2))
          PY

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-lampkeepers-phase-c-production
          path: |
            output/LittleLampkeepers_Fall_Interior.pdf
            output/LittleLampkeepers_Fall_AnswerKey.pdf
            output/LittleLampkeepers_Fall_Cover.pdf
            output/qa_report.json
            output/visual_qa.json
            output/visual_qa.md
            output/asset_ledger.json
            output/generation_summary.json
            output/cover_geometry.json
            output/previews/
            assets/accepted/
            assets/raw/
            ops/asset_ledger.json
            ops/asset_ledger.jsonl
            content/books/bright_hearts_fall_01/prompt_packets.json
          if-no-files-found: warn
