name: GPT2 OpenAI Image API Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpt2-image-api-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpt2-image-api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GPT2: ${{ secrets.GPT2 }}
    steps:
      - name: Verify GPT2 secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GPT2:-}" ]; then
            echo "GPT2_SECRET_MISSING"
            exit 1
          fi
          echo "GPT2_SECRET_PRESENT"

      - name: Verify OpenAI API authentication and image-model access
        shell: bash
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/models.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GPT2}" \
            --header 'Accept: application/json' \
            'https://api.openai.com/v1/models')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "OPENAI_API_AUTH_FAILED_HTTP_${HTTP_CODE}"
            exit 1
          fi

          echo "OPENAI_API_AUTH_OK"

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/models.json').read_text())
          ids = {item.get('id') for item in payload.get('data', []) if isinstance(item, dict)}
          targets = [
              'gpt-image-2',
              'gpt-image-2.5-flare',
              'gpt-image-2.5-sunburst',
          ]
          for model in targets:
              print(f"MODEL_ACCESS {model}={'YES' if model in ids else 'NO'}")
          PY

          # Verify the specific GPT-Image-2 model endpoint without generating an image.
          MODEL_CODE=$(curl --silent --show-error \
            --output /tmp/model.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GPT2}" \
            --header 'Accept: application/json' \
            'https://api.openai.com/v1/models/gpt-image-2')

          if [ "$MODEL_CODE" = "200" ]; then
            echo "GPT_IMAGE_2_ENDPOINT_OK"
          else
            echo "GPT_IMAGE_2_ENDPOINT_HTTP_${MODEL_CODE}"
            exit 1
          fi

      - name: Confirm no paid image generation occurred
        run: echo "NO_IMAGE_GENERATION_REQUEST_SENT"
