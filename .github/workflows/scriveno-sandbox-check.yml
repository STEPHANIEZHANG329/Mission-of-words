name: Scriveno sandbox safety check

on:
  push:
    branches:
      - integrate-scriveno-3.8.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create isolated worktree
        run: |
          rm -rf /tmp/scriveno-sandbox
          git worktree add --detach /tmp/scriveno-sandbox HEAD

      - name: Install dependencies in sandbox
        working-directory: /tmp/scriveno-sandbox
        run: npm install --no-audit --no-fund

      - name: Snapshot repository before Scriveno initialization
        working-directory: /tmp/scriveno-sandbox
        run: |
          sha256sum PRODUCTION_TASK.md | tee /tmp/production-task-before.sha256
          git status --short | tee /tmp/git-status-before.txt
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            -print | sort > /tmp/files-before.txt

      - name: Initialize Scriveno 3.8.0 in sandbox only
        working-directory: /tmp/scriveno-sandbox
        run: |
          npx scriveno@3.8.0 --runtimes cursor --project --writer --silent

      - name: Verify production contract is untouched
        working-directory: /tmp/scriveno-sandbox
        run: |
          sha256sum PRODUCTION_TASK.md | tee /tmp/production-task-after.sha256
          diff -u /tmp/production-task-before.sha256 /tmp/production-task-after.sha256
          git diff --exit-code -- PRODUCTION_TASK.md

      - name: Inventory Scriveno-created files
        working-directory: /tmp/scriveno-sandbox
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            -print | sort > /tmp/files-after.txt
          diff -u /tmp/files-before.txt /tmp/files-after.txt | tee /tmp/scriveno-file-inventory.diff || true
          git status --short | tee /tmp/git-status-after.txt
          git diff | tee /tmp/tracked-file-diff.txt

      - name: Run read-only Scriveno checks
        working-directory: /tmp/scriveno-sandbox
        run: |
          npx scriveno@3.8.0 status --project . --json | tee /tmp/scriveno-status.json
          npx scriveno@3.8.0 sync --check | tee /tmp/scriveno-sync-check.txt

      - name: Publish test summary
        if: always()
        run: |
          {
            echo '## Scriveno 3.8.0 sandbox safety check'
            echo
            echo '### PRODUCTION_TASK.md hash before'
            echo '```'
            cat /tmp/production-task-before.sha256 2>/dev/null || true
            echo '```'
            echo '### PRODUCTION_TASK.md hash after'
            echo '```'
            cat /tmp/production-task-after.sha256 2>/dev/null || true
            echo '```'
            echo '### Files added/removed by Scriveno initialization'
            echo '```diff'
            cat /tmp/scriveno-file-inventory.diff 2>/dev/null || true
            echo '```'
            echo '### Git status after initialization'
            echo '```'
            cat /tmp/git-status-after.txt 2>/dev/null || true
            echo '```'
            echo '### Tracked-file diff after initialization'
            echo '```diff'
            cat /tmp/tracked-file-diff.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sandbox report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scriveno-sandbox-report
          path: |
            /tmp/production-task-before.sha256
            /tmp/production-task-after.sha256
            /tmp/files-before.txt
            /tmp/files-after.txt
            /tmp/scriveno-file-inventory.diff
            /tmp/git-status-before.txt
            /tmp/git-status-after.txt
            /tmp/tracked-file-diff.txt
            /tmp/scriveno-status.json
            /tmp/scriveno-sync-check.txt
