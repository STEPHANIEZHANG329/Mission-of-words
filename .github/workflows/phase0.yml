name: Phase 0 Production Harness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Build 4-page Phase 0 sample
        env:
          PYTHONPATH: src
        run: python -m mission_of_words.build_sample

      - name: Verify QA gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/qa_report.json').read_text())
          assert report['paid_image_calls'] == 0
          assert report['sample_pages'] == 4
          assert report['pass'] is True
          print(json.dumps(report, indent=2))
          PY

      - name: Upload Phase 0 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bright-hearts-phase0
          path: |
            output/BrightHearts_ShineYourLight_Phase0.pdf
            output/BrightHearts_ShineYourLight_AnswerKey.pdf
            output/qa_report.json
          if-no-files-found: error
