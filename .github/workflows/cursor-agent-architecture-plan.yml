name: Cursor Agent Architecture Plan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cursor-agent-architecture-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/STEPHANIEZHANG329/Mission-of-words

jobs:
  plan-agent-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CURSOR: ${{ secrets.CURSOR }}
    steps:
      - name: Verify CURSOR secret exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CURSOR:-}"
          echo "CURSOR_SECRET_PRESENT"

      - name: Create Cursor planning agent
        id: create
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request

          key = os.environ['CURSOR'].strip()
          auth = base64.b64encode(f"{key}:".encode()).decode()
          prompt = r'''You are the senior engineering architect for the Mission-of-words / Bright Hearts publishing factory.

Do NOT modify files, do NOT commit code, and do NOT create a PR. Work in PLAN mode only. Inspect this repository and return a concrete architecture plan for an agentic production system where ChatGPT acts as product manager/reviewer and Cursor Cloud Agent acts as coding/execution engineer.

Business goal:
- Produce high-quality Christian children's activity books for Amazon KDP with very low upfront cost and reusable automation.
- First product is a 5-8 age Christian fall activity book.
- The system, not page count, is the core asset.

Already available in GitHub Secrets:
- CURSOR: valid Cursor Cloud Agents API key.
- GPT2: valid OpenAI API key with access to gpt-image-2, gpt-image-2.5-flare, and gpt-image-2.5-sunburst.
Never expose secret values.

Required production principles:
1. AI image model creates artwork only; code creates product logic, text, layout, puzzles, answer keys, PDF, and deterministic QA.
2. Search-and-find must use an AI/background plus independently controlled target assets and coordinates so every target is guaranteed to exist.
3. Mazes must be programmatic and automatically solvability-tested.
4. Maintain 8.5x11 KDP layout, 300-DPI output, inside safety >=0.50 inch, child instruction text >=12pt, puzzle letters >=12pt, answer key >=9pt.
5. Bible content must be source-locked. Avoid invented Bible facts. Separate source text, child-friendly paraphrase, activity mechanics, and visual prompt.
6. Every paid model call must be budget-gated. No uncontrolled loops. Track cost per accepted asset, not cost per generation.
7. Owner remains sole approval for publishing, budget increases, merge/release, and scaling from prototype to full book.
8. First milestone is a 4-page prototype only: hero/coloring page, deterministic search-and-find, programmatic maze, faith interaction page.
9. Keep raw/accepted/rejected assets and provenance metadata.
10. Design the architecture so later products can reuse the same production engine.

Your deliverable should include:
A. Recommended agent architecture and role boundaries (ChatGPT PM, Cursor engineer, GitHub Actions, OpenAI Image API, human Owner).
B. Exact repository directory structure.
C. State machine/workflow from mission brief -> assets -> page generation -> QA -> owner approval -> KDP package.
D. Proposed JSON schemas for book/mission/page/asset/QA records.
E. GitHub Actions/workflow design, including where secrets are used and how to prevent accidental paid calls.
F. How ChatGPT should hand tasks to Cursor and how Cursor should return durable evidence/results.
G. Minimum viable orchestration layer for Phase 1 versus features that should be deferred.
H. Failure handling, idempotency, retry limits, budget controls, and audit log.
I. A build order of no more than 10 implementation steps.
J. Identify the three biggest technical risks and three biggest product-quality risks.

Be opinionated and concrete. Prefer a small reliable architecture over a complicated multi-agent system. The owner does not need local ChatGPT deployment unless there is a technically necessary reason; explicitly assess whether local deployment adds material value.'''

          payload = {
              'name': 'Mission-of-words Architecture Planner',
              'prompt': {'text': prompt},
              'repos': [{'url': os.environ['REPO_URL'], 'startingRef': 'main'}],
              'mode': 'plan',
              'autoCreatePR': False,
          }
          req = urllib.request.Request(
              'https://api.cursor.com/v1/agents',
              data=json.dumps(payload).encode(),
              method='POST',
              headers={
                  'Authorization': f'Basic {auth}',
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.loads(r.read().decode())
          agent = data['agent']['id']
          run = data['run']['id']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'agent_id={agent}\nrun_id={run}\n')
          print('CURSOR_PLAN_AGENT_CREATED')
          print(f'agent_id={agent}')
          print(f'run_id={run}')
          PY

      - name: Poll Cursor plan to completion
        id: poll
        shell: bash
        env:
          AGENT_ID: ${{ steps.create.outputs.agent_id }}
          RUN_ID: ${{ steps.create.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, time, urllib.request

          key = os.environ['CURSOR'].strip()
          auth = base64.b64encode(f"{key}:".encode()).decode()
          url = f"https://api.cursor.com/v1/agents/{os.environ['AGENT_ID']}/runs/{os.environ['RUN_ID']}"
          headers = {'Authorization': f'Basic {auth}', 'Accept': 'application/json'}
          last = None
          for i in range(90):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  last = json.loads(r.read().decode())
              status = str(last.get('status', '')).upper()
              print(f'CURSOR_PLAN_STATUS {status}')
              if status == 'FINISHED':
                  result = last.get('result', '') or ''
                  open('/tmp/cursor-plan.txt', 'w', encoding='utf-8').write(result)
                  print('CURSOR_PLAN_FINISHED')
                  print('----- CURSOR PLAN START -----')
                  print(result)
                  print('----- CURSOR PLAN END -----')
                  break
              if status in {'ERROR','CANCELLED','EXPIRED','TIMEOUT'}:
                  raise SystemExit(f'Cursor run terminal failure: {status}')
              time.sleep(10)
          else:
              raise SystemExit('Cursor plan polling timed out')
          PY

      - name: Publish plan to job summary
        shell: bash
        run: |
          {
            echo '## Cursor architecture plan'
            echo
            cat /tmp/cursor-plan.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm plan-only gate
        shell: bash
        run: |
          echo "PLAN_ONLY_NO_CODE_CHANGES"
          echo "NO_OPENAI_IMAGE_GENERATION_REQUESTED"
          echo "NO_PR_CREATED"
