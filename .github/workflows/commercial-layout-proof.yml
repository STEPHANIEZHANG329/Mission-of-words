name: Internal engineering geometry (zero cost, not a product)

on:
  workflow_dispatch:
  push:
    branches:
      - 'cursor/phase-c-gpt2-rebuild-9570'
    paths:
      - 'src/mission_of_words/commercial_layout_proof_v2.py'
      - 'src/mission_of_words/internal_geometry.py'
      - 'src/mission_of_words/composition.py'
      - '.github/workflows/commercial-layout-proof.yml'

permissions:
  contents: read

jobs:
  build-layout-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm no paid image secret is available
        run: |
          set -euo pipefail
          if [ -n "${GPT2:-}" ]; then
            echo "GPT2_MUST_NOT_BE_AVAILABLE_IN_LAYOUT_PROOF"
            exit 1
          fi
          echo "INTERNAL_ENGINEERING_GEOMETRY_ONLY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile proof builder
        run: python -m py_compile src/mission_of_words/commercial_layout_proof_v2.py src/mission_of_words/internal_geometry.py src/mission_of_words/composition.py

      - name: Build internal engineering geometry PDF
        run: python -m mission_of_words.internal_geometry

      - name: Verify engineering-only outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/internal_engineering_geometry/layout_report.json').read_text())
          assert report['paid_image_calls'] == 0, report
          assert report['page_count'] == 48, report
          assert report['status'] == 'INTERNAL_ENGINEERING_ONLY', report
          assert report['owner_facing_product'] is False, report
          assert Path(report['pdf']).is_file(), report
          print(json.dumps(report, indent=2))
          PY

      - name: Upload internal engineering geometry
        uses: actions/upload-artifact@v4
        with:
          name: little-lampkeepers-internal-engineering-geometry
          path: |
            output/internal_engineering_geometry/LittleLampkeepers_INTERNAL_ENGINEERING_GeometryOnly.pdf
            output/internal_engineering_geometry/layout_report.json
            output/internal_engineering_geometry/previews/
          if-no-files-found: error
