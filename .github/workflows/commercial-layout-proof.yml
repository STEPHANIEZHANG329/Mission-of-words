name: Internal geometry mocks (zero cost, not product)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse-commercial-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse commercial layout proofs
        run: |
          set -euo pipefail
          if [ -n "${GPT2:-}" ]; then
            echo "GPT2_MUST_NOT_BE_AVAILABLE"
            exit 1
          fi
          python - <<'PY'
          raise SystemExit('REJECTED: commercial layout proofs are forbidden. Use PR CI geometry mocks labeled INTERNAL / NOT PRODUCT.')
          PY
