name: Cursor API Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cursor-api-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cursor-api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CURSOR: ${{ secrets.CURSOR }}
    steps:
      - name: Verify CURSOR secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CURSOR:-}" ]; then
            echo "CURSOR_SECRET_MISSING"
            exit 1
          fi
          echo "CURSOR_SECRET_PRESENT"

      - name: Verify Cursor Cloud Agents API authentication
        shell: bash
        run: |
          set -euo pipefail
          KEY="${CURSOR#Bearer }"
          KEY="${KEY#bearer }"

          BASIC_CODE=$(curl --silent --show-error \
            --output /tmp/cursor-basic.json \
            --write-out '%{http_code}' \
            --user "${KEY}:" \
            --header 'Accept: application/json' \
            'https://api.cursor.com/v1/agents?limit=1')

          if [ "$BASIC_CODE" = "200" ]; then
            echo "CURSOR_API_AUTH_OK_BASIC"
            exit 0
          fi

          BEARER_CODE=$(curl --silent --show-error \
            --output /tmp/cursor-bearer.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${KEY}" \
            --header 'Accept: application/json' \
            'https://api.cursor.com/v1/agents?limit=1')

          if [ "$BEARER_CODE" = "200" ]; then
            echo "CURSOR_API_AUTH_OK_BEARER"
            exit 0
          fi

          echo "CURSOR_API_AUTH_FAILED basic_http=${BASIC_CODE} bearer_http=${BEARER_CODE}"
          exit 1
