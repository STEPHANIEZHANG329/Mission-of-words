name: Bright Hearts Phase A + 4-page floor

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm PR CI cannot spend on image generation
        run: |
          set -euo pipefail
          if [ -n "${GPT2:-}" ]; then
            echo "GPT2_PRESENT_IN_PR_CI"
            exit 1
          fi
          if [ -n "${ALLOW_PAID_IMAGE_CALLS:-}" ]; then
            echo "ALLOW_PAID_IMAGE_CALLS_MUST_BE_UNSET"
            exit 1
          fi
          echo "NO_GPT2_IN_PR_CI"
          echo "ALLOW_PAID_IMAGE_CALLS_UNSET"
          echo "NO_IMAGE_GENERATION_REQUEST_WILL_BE_SENT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Evaluate 48-page Phase A blueprint
        env:
          PYTHONPATH: src
        run: python -m mission_of_words.evaluate_full_book

      - name: Verify full-book QA stays fail-closed
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/full_book_qa.json').read_text())
          print(json.dumps(report, indent=2))
          manifest = json.loads(Path('output/book_manifest.json').read_text())
          page_map = json.loads(Path('output/page_map.json').read_text())
          assert report['paid_image_calls'] == 0, report
          assert report['estimated_spend_usd'] == 0, report
          assert report['page_count'] == 48, report
          assert report['canon_bound_count'] == 8, report
          assert report['all_canons_bound'] is True, report
          assert report['facing_page_parity_ok'] is True, report
          assert report['font_floors_ok'] is True, report
          assert report['answer_key_linkage_ok'] is True, report
          assert report['unique_content_ok'] is True, report
          assert report['unfilled_art_slots'] == 48, report
          assert report['placeholder_assets_present'] is True, report
          assert report['blueprint_pass'] is True, report['failures']
          assert report['technical_pass'] is False, report
          assert report['production_pass'] is False, report
          assert report['pass'] is False, report
          assert report['blockers'], report
          assert manifest['target_page_count'] == 48
          assert manifest['paid_image_calls_authorized'] == 0
          assert len(manifest['pages']) == 48
          assert len(page_map) == 48
          PY

      - name: Build 4-page prototype floor
        env:
          PYTHONPATH: src
        run: python -m mission_of_words.build_sample

      - name: Verify 4-page prototype factory gate
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/qa_report.json').read_text())
          print(json.dumps(report, indent=2))
          visual = Path('output/visual_qa.md').read_text()
          print(visual)
          assert report['paid_image_calls'] == 0, report
          assert report['estimated_spend_usd'] == 0, report
          assert report['sample_pages'] == 4, report
          assert report['canon_bound'] is True, report
          assert report['search_find_all_targets_present'] is True, report
          assert report['search_find_answer_key_from_manifest'] is True, report
          assert report['maze_solvable'] is True, report
          assert report['maze_perfect_unique_path'] is True, report
          assert report['layout_ok'] is True, report
          assert report['facing_page_parity_ok'] is True, report
          assert report['placeholder_copy_absent'] is True, report
          assert report['artwork_status'] != 'placeholder_only', report
          assert report['visual_qa_pass'] is True, report
          assert report['preview_count'] == 4, report
          assert report['technical_pass'] is True, report
          assert report['production_pass'] is False, report
          assert report['pass'] is True, report['failures']
          for name in (
              'BrightHearts_ShineYourLight_Interior.pdf',
              'BrightHearts_ShineYourLight_AnswerKey.pdf',
              'qa_report.json',
              'visual_qa.md',
              'asset_register.json',
              'previews/page_01.png',
              'previews/page_02.png',
              'previews/page_03.png',
              'previews/page_04.png',
              'full_book_qa.json',
              'book_manifest.json',
              'page_map.json',
          ):
              path = Path('output') / name
              assert path.is_file(), path
          assert 'Asset Integration' in visual
          assert 'Child Usability' in visual
          assert 'Prompt-to-Art' in visual
          PY

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: bright-hearts-phase-a-blueprint
          path: |
            output/full_book_qa.json
            output/book_manifest.json
            output/page_map.json
            content/books/bright_hearts_fall_01/book_manifest.json
            output/BrightHearts_ShineYourLight_Interior.pdf
            output/BrightHearts_ShineYourLight_AnswerKey.pdf
            output/qa_report.json
            output/visual_qa.md
            output/visual_qa.json
            output/asset_register.json
            output/compositions.json
            output/previews/
          if-no-files-found: error
